[project]
name = "supervisor"
version = "0.1.0"
description = "The encoding loop as a higher-order function — supplement an expert system, resolve its residue via LLM calls. No weight training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
supervisor = "supervisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supervisor"]
