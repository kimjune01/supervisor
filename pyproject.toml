[project]
name = "supervisor"
version = "0.1.0"
description = "The encoding loop as a higher-order function. Supplement an expert system, resolve its residue via LLM calls. No weight training."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "scikit-learn>=1.4",   # TF-IDF + linear baseline arm for the bench
]

[project.scripts]
supervisor = "supervisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supervisor"]
